# Machine-readable index of every experiment that produced results.
#
# scripts/check_docs.py validates this file against the filesystem: every run directory
# must have an entry here, and every path named here must exist. Add your run before you
# open a PR or the check fails.
#
# Recursive chain runs live under chains/<id>/ and carry their own documents, per-round
# snapshots and state.json. Single-shot evals live under logs/<id>/ with a flattened
# copy under exports/<id>/.

runs:
  # The seed sweep is three chain runs sharing one writeup: identical conditions to
  # chains-main, differing only in the starting document.
  - id: chains-seed-minimal
    date: 2026-09-23
    question: >-
      What do models write when the starting constitution is only 87 words, leaving
      almost everything to be authored?
    models:
      - openrouter/anthropic/claude-sonnet-5
      - openrouter/openai/gpt-5
      - openrouter/deepseek/deepseek-chat-v3.1
    runs: 219
    cost_usd: 12.07   # derived from logged tokens, not billed; see writeup
    chain_dir: chains/seed-minimal
    writeup: results/chains-seeds.md
    status: complete
    inspect_version: TODO(uday)

  - id: chains-seed-conservatism
    date: 2026-09-23
    question: >-
      Does a model preserve, dilute or dismantle a value doctrine it may not share, when
      repeatedly authoring its own successor's values?
    models:
      - openrouter/anthropic/claude-sonnet-5
      - openrouter/openai/gpt-5
      - openrouter/deepseek/deepseek-chat-v3.1
    runs: 191
    cost_usd: 14.54   # derived from logged tokens, not billed; see writeup
    chain_dir: chains/seed-eb_conservatism
    writeup: results/chains-seeds.md
    status: complete
    inspect_version: TODO(uday)

  - id: chains-seed-kindness
    date: 2026-09-23
    question: >-
      Same question as the conservatism run, against an impartial-care doctrine, to test
      whether any dismantling is doctrine-specific.
    models:
      - openrouter/anthropic/claude-sonnet-5
      - openrouter/openai/gpt-5
      - openrouter/deepseek/deepseek-chat-v3.1
    runs: 194
    cost_usd: 13.62   # derived from logged tokens, not billed; see writeup
    chain_dir: chains/seed-eb_universal_kindness
    writeup: results/chains-seeds.md
    status: complete
    inspect_version: TODO(uday)

  - id: chains-main
    date: 2026-09-22
    question: >-
      What happens to a constitution across repeated rounds in which a model authors the
      values of its own successor and is then governed by what it wrote?
    models:
      - openrouter/anthropic/claude-sonnet-5
      - openrouter/openai/gpt-5
      - openrouter/deepseek/deepseek-chat-v3.1
    runs: 165
    cost_usd: 8.30   # billed total from OpenRouter; per-model figures in the writeup are derived
    chain_dir: chains/main
    writeup: results/chains-main.md
    status: complete
    inspect_version: TODO(uday)   # not recorded at run time; see docs/running-your-own.md

  # Ablation study (Oct 21): one chain directory per arm and seed, all models inside.
  # The base arm on c0_minimal for Sonnet and GPT-5 is chains/seed-minimal, reused.
  - id: abl-base-minimal
    date: 2026-10-21
    question: >-
      Does the chains-seeds design (governed from round 2, preferred_self) reach a fixed point, and where, from each seed? Seed c0_minimal.
    models:
      - openrouter/deepseek/deepseek-chat-v3.1
      - openrouter/qwen/qwen3.8-27b
    runs: 48
    cost_usd: 0.21   # derived from logged tokens at listed prices; billed total for the night is in the run notes
    chain_dir: chains/abl-base-minimal
    writeup: results/ablations-run-notes.md
    status: complete
    inspect_version: 0.3.222
